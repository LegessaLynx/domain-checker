services:
  domain-checker:
    build: .
    container_name: domain-checker
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      DOMAIN_CHECKER_SCAN_DELAY: "1"
    volumes:
      - ./data:/data
      - ./public/words.json:/app/public/words.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
